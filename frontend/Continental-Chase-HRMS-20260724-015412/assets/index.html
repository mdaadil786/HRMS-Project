<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Continental Chase employee lifecycle and workforce management dashboard.">
  <title>Continental Chase Dashboard</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/css/fontawesome-local.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <div class="loading-screen" id="loadingScreen" role="status" aria-live="polite">
    <span class="brand-mark" aria-hidden="true">CC</span>
    <strong>Continental Chase</strong>
  </div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="sidebar__brand">
        <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Collapse sidebar" aria-expanded="true" title="Toggle sidebar">
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>
        <span class="brand-name">Continental Chase</span>
      </div>

      <nav class="sidebar__nav" aria-label="HR modules">
        <button class="nav-item active" type="button" data-route="dashboard" aria-label="Dashboard" title="Dashboard" aria-current="page"><i class="fa-solid fa-house"></i><span>Dashboard</span></button>
        <button class="nav-item" type="button" data-route="profile" aria-label="My Profile" title="My Profile"><i class="fa-solid fa-user"></i><span>My Profile</span></button>
        <button class="nav-item" type="button" data-route="employees" aria-label="Employees" title="Employees"><i class="fa-solid fa-users"></i><span>Employees</span></button>
        <button class="nav-item" type="button" data-route="attendance" aria-label="Attendance" title="Attendance"><i class="fa-solid fa-clock"></i><span>Attendance</span></button>
        <button class="nav-item" type="button" data-route="leave" aria-label="Leave" title="Leave"><i class="fa-solid fa-calendar-days"></i><span>Leave</span></button>
        <button class="nav-item" type="button" data-route="payroll" aria-label="Payroll" title="Payroll"><i class="fa-solid fa-money-check-dollar"></i><span>Payroll</span></button>
        <button class="nav-item" type="button" data-route="recruitment" aria-label="Recruitment" title="Recruitment"><i class="fa-solid fa-briefcase"></i><span>Recruitment</span></button>
        <button class="nav-item" type="button" data-route="performance" aria-label="Performance" title="Performance"><i class="fa-solid fa-chart-line"></i><span>Performance</span></button>
        <button class="nav-item" type="button" data-route="reports" aria-label="Reports" title="Reports"><i class="fa-solid fa-chart-pie"></i><span>Reports</span></button>
        <button class="nav-item" type="button" data-route="settings" aria-label="Settings" title="Settings"><i class="fa-solid fa-gear"></i><span>Settings</span></button>
      </nav>

      <button class="quick-add" type="button" data-toast="Quick employee action menu" aria-label="Quick Add" title="Quick Add">
        <i class="fa-solid fa-plus"></i>
        <span>Quick Add</span>
        <i class="fa-solid fa-chevron-down"></i>
      </button>

      <button class="nav-item nav-item--logout" type="button" data-toast="Secure sign out" aria-label="Logout" title="Logout"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></button>
    </aside>

    <main class="main">
      <header class="topbar">
        <label class="search-field">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span class="sr-only">Search Continental Chase workforce data</span>
          <input id="globalSearch" type="search" placeholder="Search employees, departments, leave, payroll..." autocomplete="off">
        </label>
        <div class="topbar__actions">
          <button class="icon-button has-badge" type="button" aria-label="Notifications" title="Notifications" data-count="8"><i class="fa-solid fa-bell"></i></button>
          <button class="icon-button has-badge" type="button" aria-label="Messages" title="Messages" data-count="5"><i class="fa-solid fa-envelope"></i></button>
          <button class="icon-button" type="button" aria-label="Open calendar" title="Calendar"><i class="fa-solid fa-calendar-days"></i></button>
          <time class="date-pill" id="currentDate" datetime=""></time>
          <label class="theme-selector" title="Theme">
            <i class="fa-solid fa-palette" aria-hidden="true"></i>
            <span class="sr-only">Theme</span>
            <select id="themeSelect" aria-label="Theme selector">
              <option value="corporate-blue">Corporate Blue</option>
              <option value="executive-purple">Executive Purple</option>
              <option value="emerald-green">Emerald Green</option>
              <option value="slate-gray">Slate Gray</option>
              <option value="sunset-orange">Sunset Orange</option>
              <option value="dark-mode">Dark Mode</option>
              <option value="baby-pink">Baby Pink</option>
            </select>
          </label>
          <div class="profile-menu">
            <button class="profile-button" id="profileButton" type="button" aria-expanded="false" aria-haspopup="true" aria-label="User profile" title="User profile">
              <i class="fa-solid fa-user-circle profile-icon" aria-hidden="true"></i>
              <span class="profile-copy"><strong>Sarah Spencer</strong><small>VP, People Operations</small></span>
              <i class="fa-solid fa-chevron-down"></i>
            </button>
            <div class="profile-dropdown" id="profileDropdown" role="menu">
              <div class="profile-dropdown__identity">
                <span class="avatar avatar--small" aria-hidden="true">SS</span>
                <div>
                  <strong>Sarah Spencer</strong>
                  <small>sarah.spencer@continentalchase.com</small>
                </div>
              </div>
              <a href="#" role="menuitem">Logout</a>
            </div>
          </div>
        </div>
      </header>

      <section class="view-root" id="viewRoot" aria-live="polite"></section>

      <footer class="footer">
        <span>Continental Chase Workforce Platform v1.0</span>
        <span>People Operations</span>
        <span>Copyright 2026. All rights reserved.</span>
      </footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/sidebar.js"></script>
  <script src="assets/js/dashboard.js"></script>
  <script src="assets/js/employees.js"></script>
  <script src="assets/js/attendance.js"></script>
  <script src="assets/js/leave.js"></script>
  <script src="assets/js/payroll.js"></script>
  <script src="assets/js/recruitment.js"></script>
  <script src="assets/js/performance.js"></script>
  <script src="assets/js/reports.js"></script>
  <script src="assets/js/settings.js"></script>
  <script src="assets/js/profile.js"></script>
  <script src="assets/js/navigation.js"></script>
  
</body>
</html>
